<script>
const courses=[{"id": 0, "zone": 0, "title": "什麼是回教、伊斯蘭與穆斯林", "slug": "what-is-islam-and-muslim", "text": "Islam 是伊斯蘭的音譯，在臺灣也常稱回教；其信徒稱穆斯林。作者強調，信仰不只關乎內心，也引導生活中的自省、感恩與待人方式，且不限定於某個族群。", "q": "Muslim 指的是？", "opts": ["特定國家的人", "伊斯蘭的信徒", "一種語言"], "answer": 1, "explain": "穆斯林是信徒的稱呼，不是國籍。"}, {"id": 1, "zone": 0, "title": "真主和宇宙、人類的關係", "slug": "allah-universe-and-humans", "text": "本章從伊斯蘭信仰介紹真主為唯一造物主，以及人類敬拜、感恩和妥善經營大地的責任。作者將生活關係分為「人與真主」和「人與他人」，並說明符合信仰的在地習俗可以保留。", "q": "本章提醒人們照顧哪兩種關係？", "opts": ["人與真主、人與他人", "只關心自己與財產", "只重視同國籍的人"], "answer": 0, "explain": "敬拜與待人都屬於本章討論的生活責任。"}, {"id": 2, "zone": 0, "title": "責任與行為", "slug": "responsibilities-and-behaviors", "text": "人的選擇與責任相連，但履行責任也要考慮實際能力與處境。作者指出，年齡、理解能力、受迫或疾病等情況會影響責任，不能對每個人作一律相同的要求。", "q": "判斷一個人應負的責任時，應怎麼做？", "opts": ["完全忽略能力", "只看別人的表現", "考慮能力與實際處境"], "answer": 2, "explain": "教材提醒，責任需要連同能力與處境理解。"}, {"id": 3, "zone": 1, "title": "穆斯林的信仰", "slug": "muslim-faith", "text": "清真言表達對獨一真主的信仰，以及穆罕默德為真主使者的身分。作者認為，學習清真言包含念誦、理解意義和付諸生活，而不只是記住字句。", "q": "依本章，理解清真言之後還應？", "opts": ["將信仰意義落實於生活", "只記住字形", "只在測驗時想起"], "answer": 0, "explain": "教材將理解與日常實踐連在一起。"}, {"id": 4, "zone": 1, "title": "六件信德（分信）", "slug": "six-beliefs", "text": "本書整理六項主要信仰：真主、天使、經典、使者、末日與前定。這些回答信仰的基本內容；五功則著重宗教實踐。作者也說明穆斯林尊敬天使與使者，但不將其作為崇拜對象。", "q": "「六信」與「五功」主要差別是？", "opts": ["都是六個節日", "六信談信仰內容，五功談實踐", "只是同一詞的不同寫法"], "answer": 1, "explain": "六信與五功相互關聯，但分類重點不同。"}, {"id": 5, "zone": 1, "title": "五功", "slug": "five-pillars", "text": "五功可用念、禮、齋、課、朝記憶，分別關乎信仰宣言、禮拜、齋戒、天課與朝覲。作者把念功視為信仰基礎，並說明各項功課有條件與規範，不是人人每天都進行所有功課。", "q": "「課」所指的是？", "opts": ["一般課堂", "朝覲", "天課"], "answer": 2, "explain": "課功指天課，與符合規定的財產分配有關。"}, {"id": 6, "zone": 2, "title": "齋戒", "slug": "fasting", "text": "本章將齋戒介紹為：符合條件者先立意，在黎明到黃昏的白晝時段遵守齋戒規範，包括暫停飲食。教材另分別討論適用條件與特殊處境；實踐時須完整閱讀相關規定。", "q": "本章介紹的每日齋戒時段是？", "opts": ["黎明至黃昏", "午夜至黎明", "整個月不停飲食"], "answer": 0, "explain": "齋戒有每日的起訖時段。"}, {"id": 7, "zone": 2, "title": "天課", "slug": "zakat", "text": "天課以符合規定的財產、數額與時期等條件為基礎，依規範分配給法定對象。作者強調幫助有需要的人、培養慷慨及感恩。各類財產的計算規則不同，不能用單一比例概括所有情況。", "q": "天課的對象如何決定？", "opts": ["隨機決定即可", "依規定給予符合資格的對象", "只給自己"], "answer": 1, "explain": "教材指出天課有法定對象，並非任意的財物支出。"}, {"id": 8, "zone": 2, "title": "朝覲", "slug": "hajj", "text": "朝覲在規定的時間、地點完成特定功課，並涉及能力與其他條件。本章也介紹副朝；副朝與朝覲在時程與儀式上有差異，兩者不應混為一談。", "q": "朝覲與副朝的關係是？", "opts": ["名稱不同但完全一樣", "都沒有時間規定", "相關，但時程與功課有差異"], "answer": 2, "explain": "本章分別解釋朝覲與副朝。"}, {"id": 9, "zone": 3, "title": "伊斯蘭的寬容", "slug": "tolerance-in-islam", "text": "作者以共同利益和多元社會為出發點，討論尊重不同民族、語言與習俗。入門學習可以從不以單一文化代表所有人、先理解彼此差異開始。", "q": "面對不同語言與習俗，哪種態度符合本章重點？", "opts": ["尊重差異並尋求理解", "要求所有人完全一樣", "用刻板印象判斷"], "answer": 0, "explain": "本章強調多元、尊重與共同利益。"}, {"id": 10, "zone": 3, "title": "穆斯林常用語彙", "slug": "common-phrases", "text": "道安詞傳達祝願對方平安的心意，回答詞則回以平安祝願。教材也介紹開始詞、求護佑詞及讚詞，將語句與生活情境連結。進入禮拜中的大殿時，應避免高聲問候而打擾他人。", "q": "道安詞主要傳達什麼？", "opts": ["交易價格", "對他人的平安祝願", "自己的職業"], "answer": 1, "explain": "道安是平安的問候，也需顧及場合。"}, {"id": 11, "zone": 3, "title": "好的品德與習慣", "slug": "good-morale-and-habits", "text": "本章把中庸之道放在做人、學習和處事之中，鼓勵言行一致、團結互助及寬容。學習目標是讓價值觀在小事中持續實踐。", "q": "哪個例子最符合本章重點？", "opts": ["只說不做", "以偏激言語壓過他人", "守信用並在需要時協助別人"], "answer": 2, "explain": "言行一致與互助，是本章提到的品德方向。"}, {"id": 12, "zone": 4, "title": "誦讀《古蘭經》的禮儀", "slug": "quran-recitation-etiquette", "text": "作者重視讀經時的潔淨、恭敬與動機，並提醒選擇清潔安靜之處、避免干擾附近的人。誦讀也涉及專門的音韻學習；這個入門導讀不以合成發音取代誦讀教學。", "q": "選擇誦讀環境時，應注意？", "opts": ["清潔安靜且不干擾他人", "音量越大越好", "不必考慮附近的人"], "answer": 0, "explain": "教材將恭敬的態度與不打擾他人一併說明。"}, {"id": 13, "zone": 4, "title": "合法與非法的飲食規範", "slug": "halal-and-haram-diet", "text": "本章從食物本身、加工製作及取得來源等面向介紹飲食規範。判斷不只看名稱，也要了解成分與處理過程；例如加工程序是否含禁用成分。詳細分類與特殊情況應回到原文閱讀。", "q": "依本章，判斷飲食是否合規時？", "opts": ["只看包裝顏色", "考慮成分、製作與取得來源", "只看是不是進口"], "answer": 1, "explain": "飲食規範不只涉及食材名稱。"}, {"id": 14, "zone": 4, "title": "與清真寺有關的一些規定", "slug": "masjid-ruling", "text": "教材提醒維護清真寺的清潔與安寧，輕聲交談，不任意取走物品，也不干擾禮拜者。文中另列不同活動的規定，並提到部分學者觀點；實際參訪時可向寺方了解安排。", "q": "參訪清真寺時，哪個行為合宜？", "opts": ["大聲談笑", "任意帶走物品", "保持清潔、輕聲並尊重禮拜者"], "answer": 2, "explain": "清潔、安寧及尊重他人是這一課的重點。"}, {"id": 15, "zone": 5, "title": "交友與婚姻", "slug": "marriage", "text": "本章從宗教觀點談婚姻與家庭，重視夫妻之間的情誼、慈愛和安定，也說明家庭在照顧成員與文化傳承中的角色。導讀聚焦相互扶持與責任，不代替個別婚姻或法律諮詢。", "q": "依本章，家庭關係重視什麼？", "opts": ["相互扶持、慈愛與責任", "只重視外在條件", "不必關心家人"], "answer": 0, "explain": "教材把婚姻與家庭的照顧、安定及情感連結在一起。"}, {"id": 16, "zone": 5, "title": "生養幼兒的禮俗", "slug": "child-raising-etiquette", "text": "本章介紹迎接新生、祝賀與命名等禮俗，也強調父母需提供良好的教育和成長環境。命名重視美好意義。此課僅作文化導讀，涉及嬰幼兒照護的操作應由醫療專業指導。", "q": "本章指出父母的重要責任是？", "opts": ["只有取名", "提供良好教育和成長環境", "全部交給孩子自己"], "answer": 1, "explain": "除了禮俗，教材也強調養育與教育責任。"}, {"id": 17, "zone": 5, "title": "殯葬禮儀", "slug": "funeral-etiquette", "text": "這一章由探病、關懷患者談起，再延伸到生命末期與殯葬事宜。入門重點是聆聽、安慰與尊重；探病不宜停留過久。具體儀式請閱讀原章並與家屬、教長及相關專業人員討論。", "q": "探病時哪種做法較合宜？", "opts": ["只顧談自己的事", "堅持久留", "聆聽與安慰，並顧及患者休息"], "answer": 2, "explain": "教材提醒關心患者，也要避免久留造成負擔。"}];
const zones=[
{title:'初見港灣',en:'Start with understanding',pos:[27,50],desc:'從名詞、世界觀與責任出發，認識《穆民基礎》的生活視角。'},
{title:'信仰之庭',en:'Belief and practice',pos:[49,37],desc:'理解清真言、六件信德與五功，建立信仰與實踐的基本架構。'},
{title:'功修廣場',en:'A journey of devotion',pos:[73,50],desc:'進一步認識齋戒、天課與朝覲，理解各項功課的意義與條件。'},
{title:'善意市集',en:'Kindness in everyday life',pos:[25,72],desc:'從平安的問候到互相扶持，讓寬容與好品德成為日常的一部分。'},
{title:'生活書屋',en:'Learning through daily life',pos:[64,79],desc:'認識誦經、飲食與清真寺禮儀，學習尊重不同情境中的規範。'},
{title:'家庭花園',en:'Care through every season',pos:[43,85],desc:'從建立家庭到關懷生命，理解陪伴、教育與彼此照顧的責任。'}
];
const base='https://www.islamtaiwan.com/muslim-basics/';
const key='salaam-muslim-basics-v2';
const $=s=>document.querySelector(s);const modal=$('#modal');let selected=0,current=0,done=[];try{const stored=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(stored))done=[...new Set(stored.filter(n=>Number.isInteger(n)&&n>=0&&n<courses.length))]}catch{}
function source(c){return `<a href="${base+c.slug}" target="_blank" rel="noopener">原文：${c.title} ↗</a>`}
function zoneCourses(z){return courses.filter(c=>c.zone===z)}
function show(html){$('#body').innerHTML=html;if(!modal.open)modal.showModal();modal.scrollTop=0;$('.close').focus()}
function render(){ $('#count').textContent=done.length+' / '+courses.length;$('#bar').style.width=done.length/courses.length*100+'%';$('#nodes').innerHTML=zones.map((z,i)=>{const complete=zoneCourses(i).every(c=>done.includes(c.id));return `<button class="node ${selected===i?'active':''} ${complete?'done':''}" style="left:${z.pos[0]}%;top:${z.pos[1]}%" onclick="selectZone(${i})" aria-label="${z.title}${complete?'，已完成':''}"><b>${complete?'✓':String(i+1).padStart(2,'0')}</b>${z.title}</button>`}).join('');const z=zones[selected],list=zoneCourses(selected),n=list.filter(c=>done.includes(c.id)).length;$('#card').innerHTML=`<div class="tag">區域 ${String(selected+1).padStart(2,'0')} / 06　·　已完成 ${n} / ${list.length}</div><h2>${z.title}</h2><div class="roman">${z.en}</div><p>${z.desc}</p><div class="lesson-points">${list.map(c=>`<button class="chapter" onclick="readLesson(${c.id})"><span>${done.includes(c.id)?'✓':'○'} ${c.title}</span><span>→</span></button>`).join('')}</div><div class="source">導讀依據：趙錫麟教長著《穆民基礎》<br>原文刊載：Islam Taiwan</div><button class="primary" onclick="readLesson(${(list.find(c=>!done.includes(c.id))||list[0]).id})">${n===list.length?'再次閱讀':'開始這一區'}<span>→</span></button>`}
function selectZone(i){selected=i;render()}
function readLesson(id){current=id;selected=courses[id].zone;render();const c=courses[id];show(`<div class="tag">${zones[selected].title} · 第 ${id+1} / 18 課 · 約 2 分鐘</div><h2>${c.title}</h2><div class="reading"><p>${c.text}</p><div class="source">本課為原章重點摘要，非全文或逐字經文翻譯。<br>${source(c)}</div><p class="note">${selected===5?'本區為文化與宗教觀點導讀；具體照護、婚姻或殯葬安排需依個別情況向相應專業人員確認。':'先讀摘要，再閱讀原章，能更完整理解適用條件與細節。'}</p></div><div class="quiz"><div class="tag">理解小測驗</div><h3>${c.q}</h3>${c.opts.map((o,i)=>`<button class="option" onclick="answer(${i},this)">${o}</button>`).join('')}<div class="feedback" aria-live="polite"></div></div>`)}
function answer(i,el){const c=courses[current];if(i!==c.answer){el.classList.add('wrong');$('.feedback').textContent='再想一想：回到上方摘要，找找與問題相關的線索。';return}el.classList.add('correct');document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(!done.includes(current))done.push(current);let saved=true;try{localStorage.setItem(key,JSON.stringify(done))}catch{saved=false}$('.feedback').innerHTML=`✓ 答對了！${c.explain}<p>${done.length===courses.length?'恭喜完成全部 18 課！歡迎隨時回島複習，或繼續閱讀原書。':'已留下這一課的探索足跡。'}${saved?'':'目前無法儲存進度，離開頁面後可能遺失。'}</p><button class="primary" onclick="nextLesson()">${done.length===courses.length?'回到島嶼':'繼續探索'} →</button>`;render()}
function nextLesson(){if(done.length===courses.length){modal.close();return}const remaining=courses.filter(c=>!done.includes(c.id));readLesson((remaining.find(c=>c.id>current)||remaining[0]).id)}
function directory(){show(`<div class="tag">COURSE DIRECTORY</div><h2>我的探索足跡</h2><p>已完成 ${done.length} / 18 課。進度保存在目前的瀏覽器。</p><div class="directory">${zones.map((z,i)=>`<h3>${i+1}. ${z.title}</h3>${zoneCourses(i).map(c=>`<button class="chapter" onclick="readLesson(${c.id})"><span>${done.includes(c.id)?'✓':'○'} ${c.title}</span><span>→</span></button>`).join('')}`).join('')}</div><p class="small">本版以18個正文主題為短課；序、後記與附錄請至原站閱讀。與舊版六課的進度分開保存。</p><button class="plain" onclick="resetProgress()">重新開始本版旅程</button>`)}
function resetProgress(){show(`<h2>重新開始旅程？</h2><p>將清除本瀏覽器的18課完成記錄。這不會影響其他裝置。</p><button class="primary" onclick="confirmReset()">清除進度</button> <button class="plain" onclick="directory()">保留進度</button>`)}function confirmReset(){done=[];try{localStorage.removeItem(key)}catch{}render();directory()}
$('.close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});$('#journal').onclick=directory;
$('#about').onclick=()=>show(`<div class="tag">READ • UNDERSTAND • EXPLORE</div><h2>關於這份互動導讀</h2><div class="reading"><p>本島依據趙錫麟教長著《穆民基礎》，以 Islam Taiwan 刊載的網路版為來源，將18個正文主題整理成六區短課。摘要與測驗為本網站重新編寫，原書與原站權利歸其權利人所有。</p><p>本網站為獨立製作的學習導讀，非作者或 Islam Taiwan 官方產品，也不代表其審核或背書。摘要不取代完整教材；教法細節與學派觀點請回到原文並向合適的教長請教。</p><p>島嶼及建築為虛構 2.5D 插畫，非真實聖地地圖。答題僅記錄教材進度，不代表宗教承諾或資格。進度儲存於本瀏覽器，不會自動跨裝置同步。</p><h3>原書入口</h3><p><a href="${base}preface" target="_blank" rel="noopener">《穆民基礎》序與完整目錄 ↗</a></p><h3>各課原文</h3>${courses.map(c=>`<div>${source(c)}</div>`).join('')}</div>`);render();
</script></body></html>
